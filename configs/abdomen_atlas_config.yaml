# AbdomenAtlas configuration for tumour-aware report generation.
# Extends base_config.yaml with dataset-specific and tumour settings.

data:
  name: "AbdomenAtlas/AbdomenAtlas3.0Mini"
  split: "IID"
  report_type: "narrative"
  # Set to "data" if downloaded via download_data.sh,
  # or to the extracted directory if using HuggingFace manually.
  data_dir: "data"

  # Tumour-specific settings
  focus_small_tumors: true
  tumor_types:
    - "liver_tumor"
    - "kidney_tumor"
    - "pancreas_tumor"

  # Preprocessing
  crop_size: [96, 96, 96]
  spacing: [1.5, 1.5, 1.5]
  normalize: true
  augmentation: true

model:
  segmentation:
    name: "swinunetr"
    pretrained: "checkpoints/suprem_swinunetr.pth"
    in_channels: 1
    out_channels: 29  # 26 organs + 3 tumour types
    img_size: [96, 96, 96]
    feature_size: 48
    tumor_channel_indices: [26, 27, 28]
    separate_tumor_features: true

  generation:
    name: "google/medgemma-2b"
    use_lora: true
    lora_config:
      r: 16
      lora_alpha: 32
      target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
      lora_dropout: 0.1
    tumor_aware_attention: true
    measurement_conditioning: true
    early_detection_weight: 2.0

training:
  num_epochs: 50
  batch_size: 4
  learning_rate: 1e-4
  weight_decay: 0.01
  gradient_accumulation_steps: 4
  fp16: true
  eval_every: 2
  save_every: 5
  early_stopping_patience: 10

  loss_weights:
    report_generation: 1.0
    small_tumor_bonus: 0.5
    tumor_detection: 0.3

  optimizer: "AdamW"
  scheduler: "cosine"
  warmup_steps: 1000

evaluation:
  metrics:
    - "BLEU-4"
    - "ROUGE-L"
    - "METEOR"
    - "Clinical F1"
  tumor_metrics:
    - "Tumor Detection Sensitivity"
    - "Tumor Detection Specificity"
    - "Early Detection Rate"
    - "PPV"
  stratify_by:
    - "tumor_size"
    - "tumor_location"
    - "report_type"

logging:
  wandb_project: "tumor-aware-report-generation"
  wandb_entity: null
  log_dir: "logs"
  save_predictions: true
  save_attention_maps: true

hardware:
  device: "cuda"
  mixed_precision: true
  num_workers: 4
  pin_memory: true

output_dir: "checkpoints"

baselines:
  - "RadGPT"
  - "LSTM"
  - "Transformer"
  - "Ours_no_tumor_attention"
  - "Ours_no_small_tumor_focus"
