# Base configuration - inherited by experiment-specific configs.

model:
  segmentation:
    name: "swinunetr"
    pretrained: null
    in_channels: 1
    out_channels: 25
    img_size: [96, 96, 96]
    feature_size: 48

  generation:
    name: "google/medgemma-2b"
    use_lora: true
    lora_config:
      r: 16
      lora_alpha: 32
      target_modules: ["q_proj", "v_proj", "k_proj", "o_proj"]
      lora_dropout: 0.1

training:
  num_epochs: 50
  batch_size: 4
  learning_rate: 1e-4
  weight_decay: 0.01
  gradient_accumulation_steps: 4
  fp16: true
  eval_every: 2
  save_every: 5

data:
  report_type: "narrative"
  num_workers: 4
  max_report_length: 512

output_dir: "checkpoints"
log_dir: "logs"
